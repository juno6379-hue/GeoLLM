version: '2.0'
templates:
  feature_search_by_radius:
    allowed_layers:
    - GBENC_S101_feature
    required_parameters:
    - base_geometry
    - distance_m
    - nftc_codes
    executor: postgis.dwithin
    default_layer: GBENC_S101_feature
    result_limit: 30
    distance_predicate: ST_DWithin
    ordering: distance_m
    sql_template: s101_feature_radius_dwithin
    sql:
      execute: |
        WITH location AS (
            SELECT ST_GeomFromText(%(base_wkt)s, %(srid)s) AS geom
        ),
        matches AS MATERIALIZED (
            SELECT
                f.{id_column} AS id,
                f.dataset_id AS source_dataset_id,
                f.dataset_version_id,
                f.{code_column} AS feature_type_code,
                f.{name_column} AS feature_type_name,
                f.{geometry_column} AS geometry,
                GeometryType(f.{geometry_column}) AS geometry_type,
                f.{attributes_column} AS attributes,
                ST_Distance(
                    f.{geometry_column}::geography, l.geom::geography
                ) AS distance_m
            FROM {relation} AS f
            CROSS JOIN location AS l
            WHERE f.{code_column} = ANY(%(feature_codes)s)
              AND f.{name_column} = ANY(%(target_features)s)
              AND f.{geometry_column} IS NOT NULL
              AND f.{geometry_column} && ST_MakeEnvelope(
                  %(xmin)s, %(ymin)s, %(xmax)s, %(ymax)s, %(srid)s
              )
              AND ST_DWithin(
                    f.{geometry_column}::geography, l.geom::geography, %(distance_m)s
              )
        ),
        page AS (
            SELECT id, source_dataset_id, dataset_version_id, feature_type_code,
                   feature_type_name, geometry_type, attributes,
                   ST_AsGeoJSON(geometry)::jsonb AS geometry, distance_m
            FROM matches
            ORDER BY distance_m, id
            LIMIT %(result_limit)s
            OFFSET %(offset)s
        ),
        type_counts AS (
            SELECT feature_type_name, count(*) AS count FROM matches GROUP BY feature_type_name
        )
        SELECT (SELECT count(*) FROM matches) AS total_count,
               COALESCE((SELECT jsonb_object_agg(feature_type_name, count) FROM type_counts), jsonb_build_object()) AS total_counts_by_type,
               COALESCE((SELECT jsonb_agg(to_jsonb(page) ORDER BY distance_m, id) FROM page), '[]'::jsonb) AS rows,
               (SELECT ST_AsGeoJSON(ST_Buffer(geom::geography, %(distance_m)s)::geometry)::jsonb FROM location) AS search_geometry;
  traffic_search_by_time_space:
    allowed_layers:
    - AIS
    - V-PASS
    default_relation: serving.dynamic_traffic_layer
    required_parameters:
    - time_range
    - geometry
    executor: traffic.dynamic_layer_search
    geometry_column: geom
    temporal_column: observed_at
    count_column: vessel_count_total
    grid_id_column: grid_id
    source_column: layer_source
    sql_template: dynamic_traffic_time_space
    sql:
      summary: |
        SELECT layer_source,
               count(*) AS grid_count,
               sum(vessel_count_total) AS vessel_count_total,
               sum(vessel_count_day) AS vessel_count_day,
               sum(vessel_count_night) AS vessel_count_night
        FROM serving.dynamic_traffic_layer
        WHERE layer_source = ANY(%(sources)s)
          AND observed_month BETWEEN %(start_month)s AND %(end_month)s
          AND (%(base_wkt)s IS NULL OR ST_DWithin(geom::geography, ST_SetSRID(ST_GeomFromText(%(base_wkt)s), 4326)::geography, %(distance_m)s))
        GROUP BY layer_source;
  nearest_feature:
    allowed_layers:
    - GBENC_S101_feature
    required_parameters:
    - base_geometry
    - feature_codes
    executor: postgis.nearest
    default_layer: GBENC_S101_feature
    result_limit: 5
    ordering: distance_m
    sql_template: s101_nearest_feature
    sql:
      select: |
        WITH location AS (
            SELECT ST_GeomFromText(%(base_wkt)s, %(srid)s) AS geom
        )
        SELECT
            f.{id_column} AS id,
            f.{code_column} AS feature_type_code,
            f.{name_column} AS feature_type_name,
            GeometryType(f.{geometry_column}) AS geometry_type,
            ST_AsGeoJSON(f.{geometry_column}) AS geojson,
            ST_Distance(
                ST_SetSRID(f.{geometry_column}, %(srid)s)::geography,
                ST_SetSRID(l.geom, %(srid)s)::geography
            ) AS distance_m,
            f.{attributes_column} AS attributes
        FROM {relation} AS f
        CROSS JOIN location AS l
        WHERE f.{code_column} = ANY(%(feature_codes)s)
          AND f.{geometry_column} IS NOT NULL
        ORDER BY distance_m, f.{id_column}
        LIMIT %(result_limit)s;
  graph_scoped_rag:
    required_parameters:
    - entity_ids
    - query
    executor: rag.graph_scoped_retrieve
  accident_s101_relation_lookup:
    allowed_layers:
    - accident_s101_relation
    required_parameters:
    - feature_instance_id
    executor: accident.s101_relation_lookup
  accident_event_lookup:
    allowed_layers:
    - accident_events
    required_parameters:
    - query_terms
    executor: accident.event_lookup
    default_relation: serving.accident_events
    geometry_column: geom
    text_filter_columns:
    - authority
    - sea_area
    - cause
    - accident_type
    - vessel_type
    ordering: occurred_at DESC, source_row_number ASC
    result_limit: 120
    sql_template: accident_event_structured_lookup
    sql:
      select: |
        SELECT event_id, source_row_number, occurred_at, authority, sea_area,
               weather, cause, accident_type, vessel_count, people_count,
               rescued, injured, dead, missing, vessel_type, tonnage,
               longitude, latitude, ST_AsGeoJSON(geom)::jsonb AS geometry
        FROM serving.accident_events
        WHERE /* query_terms are applied as AND of ILIKE over text_filter_columns */
              TRUE
        ORDER BY occurred_at DESC, source_row_number ASC
        LIMIT %(result_limit)s;
  spatial_layer_overlay_lookup:
    allowed_layers:
    - tidal_current_surface
    - eddy_hazard_area
    - planned_port_area
    required_parameters:
    - base_geometry
    executor: spatial.layer_overlay_lookup
  current_tidal_lookup:
    allowed_layers:
    - tidal_current_surface
    required_parameters:
    - base_geometry
    executor: ocean.current_tidal_lookup
    optional_parameters:
    - time_range
    - distance_m
  eddy_hazard_lookup:
    allowed_layers:
    - eddy_hazard_area
    required_parameters:
    - base_geometry
    executor: hazard.eddy_lookup
    optional_parameters:
    - distance_m
  hazard_area_lookup:
    allowed_layers:
    - eddy_hazard_area
    - caution_warning_area
    - speed_restriction_area
    - entry_restricted_area
    - anchoring_prohibited_area
    - fishing_prohibited_area
    - fishing_restricted_area
    - dumping_ground_area
    required_parameters:
    - base_geometry
    executor: hazard.area_lookup
    optional_parameters:
    - distance_m
  protected_area_lookup:
    allowed_layers:
    - protected_sea_area
    required_parameters:
    - base_geometry
    executor: protected.area_lookup
    optional_parameters:
    - distance_m
  planned_port_overlay:
    allowed_layers:
    - planned_port_area
    required_parameters:
    - base_geometry
    executor: development.planned_port_overlay
    optional_parameters:
    - distance_m
  island_gazetteer_lookup:
    allowed_layers:
    - island_gazetteer
    required_parameters:
    - base_geometry
    executor: place.island_gazetteer_lookup
    optional_parameters:
    - distance_m
  sea_parting_prediction_lookup:
    allowed_layers:
    - sea_parting_prediction
    required_parameters:
    - base_geometry
    executor: tide.sea_parting_lookup
    optional_parameters:
    - time_range
    - distance_m
  vessel_traffic_control_area_overlay:
    allowed_layers:
    - vessel_traffic_control_area
    required_parameters:
    - base_geometry
    executor: traffic.control_area_overlay
    optional_parameters:
    - distance_m
  observed_time_series_analysis:
    allowed_layers:
    - tidal_current_surface
    - sample_observation_timeseries
    required_parameters:
    - source_path
    - timestamp_column
    - value_column
    executor: timeseries.observation_analyze
    optional_parameters:
    - station_id
    - time_range
    - z_threshold
  observed_time_series_forecast:
    allowed_layers:
    - tidal_current_surface
    - sample_observation_timeseries
    required_parameters:
    - source_path
    - timestamp_column
    - value_column
    - horizon_steps
    executor: timeseries.forecast
    optional_parameters:
    - station_id
    - time_range
    - confidence_level
    - model_endpoint
