    object_types: [MarineTerm]
    default_status: VERIFIED
  mapsToConcept:
    subject_types: [MarineTerm, AccidentType, AccidentEvent, DynamicTrafficLayer]
    object_types: [DerivedConcept]
    default_status: CANDIDATE
  includesFeature:
    subject_types: [DerivedConcept]
    object_types: [Feature]
    default_status: CANDIDATE
  requiresTool:
    subject_types: [DerivedConcept]
    object_types: [Tool]
    default_status: VERIFIED
  requiresData:
    subject_types: [DerivedConcept]
    object_types: [DataLayer, DynamicTrafficLayer]
    default_status: VERIFIED
  requiresAgent:
    subject_types: [DerivedConcept]
    object_types: [Agent]
    default_status: VERIFIED
  usesLayer:
