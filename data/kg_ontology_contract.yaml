    object_types: [Attribute]
    default_status: VERIFIED
  mapsToFeature:
    subject_types: [MarineTerm, DataLayer, OntologyBindingProposal]
    object_types: [Feature]
    default_status: CANDIDATE
  classifiesTerm:
    subject_types: [TaxonomyClass]
    object_types: [MarineTerm]
    default_status: VERIFIED
  aliasOf:
