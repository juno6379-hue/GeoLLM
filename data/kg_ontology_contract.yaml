    default_status: CANDIDATE
  mentionsPlaceName:
    subject_types: [DocumentChunk]
    object_types: [PlaceNameMention]
    default_status: CANDIDATE
  hasInventoryGroup:
    subject_types: [KGInventory]
    object_types: [KGInventory]
    default_status: VERIFIED
  specializes:
    subject_types: [UpperClass]
    object_types: [UpperClass]
    default_status: VERIFIED
  belongsToUpperClass:
    subject_types: [DataLayer, DynamicTrafficLayer, DerivedConcept, MarineTerm, DomainArea, SemanticMapping]
    object_types: [UpperClass]
    default_status: VERIFIED
  belongsToDomain:
