evidence_mapping:
  spatial_feature_evidence:
    allowed_sources: [FeatureInstance, DataLayer, QueryTemplate, Tool]
    required_fields: [evidence_id, evidence_type, source_ref]
  accident_relation_evidence:
    allowed_sources: [AccidentEvent, AccidentType, FeatureInstance, DataLayer]
    required_fields: [evidence_id, evidence_type, source_ref]
  rag_evidence:
    allowed_sources: [StandardDocument, LawDocument, DocumentChunk]
    required_fields: [evidence_id, evidence_type, source_ref]
  regulatory_evidence:
    allowed_sources: [Law, LegalNotice, Authority, OfficialDataset]
    required_fields: [evidence_id, evidence_type, source_ref]
  kg_provenance:
    allowed_sources: [MarineTerm, DerivedConcept, Feature, Agent, Tool, QueryTemplate, Law, LegalNotice, OfficialDataset, KGInventory, UpperClass, DomainArea, SemanticMapping, OntologyIngestionRule, OntologyBindingProposal, EvidenceItem]
    required_fields: [evidence_id, evidence_type, source_ref]
