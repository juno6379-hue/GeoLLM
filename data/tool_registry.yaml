version: '2.0'
tools:
  catalogue.attribute_lookup:
    kind: public_catalogue_lookup
    operation: public_catalogue_attribute_lookup
    source: data/s101_feature_catalogue_v2_parsed.json
    provenance_required: true
    read_only: true
  postgis.selected_feature_lookup:
    kind: spatial_query
    operation: selected_feature_lookup
    source: projection.s101_feature_valid
  geocoder.resolve_location:
    kind: geocoding
    provenance_required: true
  gbenc.s101_feature_search_by_radius:
    kind: spatial_query
    template: feature_search_by_radius
  postgis.dwithin:
    kind: spatial_function
    function: ST_DWithin
    source_attribute_executor: services.orchestrator.marine_mapping_execution.execute
    source_attribute_mapping_registry: data/marine_s101_bindings.json
    source_attribute_policy: require_all_fc_validated_predicates_and_explicit_radius
  postgis.nearest:
    kind: spatial_function
    function: ST_Distance
    template: nearest_feature
  rag.graph_scoped_retrieve:
    kind: graph_rag
  traffic.dynamic_layer_search:
    kind: temporal_spatial_query
  accident.s101_relation_lookup:
    kind: relation_lookup
    template: accident_s101_relation_lookup
  accident.event_lookup:
    kind: structured_event_lookup
    template: accident_event_lookup
  accident.spatial_history_lookup:
    kind: spatial_event_lookup
    template: accident_spatial_history_lookup
  spatial.layer_overlay_lookup:
    kind: spatial_layer_query
    template: spatial_layer_overlay_lookup
  ocean.current_tidal_lookup:
    kind: temporal_spatial_query
    template: current_tidal_lookup
  hazard.eddy_lookup:
    kind: spatial_layer_query
    template: eddy_hazard_lookup
  hazard.area_lookup:
    kind: spatial_layer_query
    template: hazard_area_lookup
  protected.area_lookup:
    kind: spatial_layer_query
    template: protected_area_lookup
  development.planned_port_overlay:
    kind: spatial_layer_query
    template: planned_port_overlay
  place.island_gazetteer_lookup:
    kind: gazetteer_spatial_query
    template: island_gazetteer_lookup
  tide.sea_parting_lookup:
    kind: temporal_spatial_query
    template: sea_parting_prediction_lookup
  traffic.control_area_overlay:
    kind: spatial_layer_query
    template: vessel_traffic_control_area_overlay
  timeseries.observation_analyze:
    kind: time_series_analysis
    template: observed_time_series_analysis
  timeseries.forecast:
    kind: time_series_forecast
    template: observed_time_series_forecast
