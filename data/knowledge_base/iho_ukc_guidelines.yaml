title: "IHO Under Keel Clearance (UKC) Guidelines"
reference: "IHO S-129 (Under Keel Clearance Management), PIANC Guidelines"
summary: >
  IHO는 모든 선박이나 해역에 적용되는 단일한 '절대적 여유수심(UKC) 수치'를 강제하지 않으며,
  항만 당국이나 선장의 동적 위험 평가에 기반한 관리를 권장합니다.
  (참조: S-129 규격은 이러한 동적 여유수심(DUKC) 정보를 전자해도(ECDIS)에 표시하기 위한 표준입니다.)

guidelines:
  static_ukc:
    description: "전통적인 '정적 여유수심' 규칙 (보편적 참고용)"
    general_rule: "선박 흘수(Draft)의 10% ~ 15%"
    shallow_water_rule: "천수역(Shallow water)에서는 최소 10% 이상 확보 권장"
    open_sea_rule: "외해(Open sea)에서는 파랑(Swell)에 의한 동요를 고려하여 20% 이상 권장"
  
  dynamic_ukc_factors:
    description: "동적 여유수심(DUKC) 산정 시 고려해야 할 IHO 권고 요소들"
    factors:
      - "Squat Effect (선체 침하 현상): 선박의 속력과 수심에 비례하여 선체가 가라앉는 현상"
      - "Tide (조석): 실시간 조위 변화에 따른 수심 변화"
      - "Wave & Swell (파랑 및 너울): 선박의 상하 동요(Heave/Pitch/Roll) 유발"
      - "CATZOC (Category Zone of Confidence): 측량 수심 데이터의 신뢰도(오차율)에 따른 안전 버퍼 추가"

implementation_logic_for_geollm:
  condition:
    - "기본 룰: 수심 < (흘수 + 흘수 * 0.10) 인 경우 WARNING"
    - "CATZOC나 조석 정보가 불명확한 구역: 수심 < (흘수 + 흘수 * 0.15) 인 경우 HIGH"
    - "수심 < 흘수 인 경우 CRITICAL (좌초 확정)"
