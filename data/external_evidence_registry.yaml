places:
  dokdo:
    canonical_name: 독도
    aliases:
      - 독도
      - 독도 부근
      - 독도 주변
      - Dokdo
      - Liancourt Rocks
    geometry_wkt: POINT(131.864444 37.241389)
    srid: 4326
