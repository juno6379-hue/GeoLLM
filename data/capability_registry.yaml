version: '0.1'
status: dry_run
description: 'Candidate-first capability registry for GeoLLM. These entries are used to retrieve Resolver, Agent, Tool, Dataset, Ontology, marine term, and feature class candidates before KG/Registry verification. Similarity from this registry is never authority by itself.

  '
policies:
  pgvector_role: candidate_retrieval_only
  authority_gate_required: true
  ollama_role: ambiguity_resolver_only
  verified_execution_only: true
router_policies:
  instant_place_navigation:
    description: 'Allow only simple place navigation or standalone place lookup to bypass the full semantic router. Any relation, analysis target, domain layer target, or multi-tool target must continue to Semantic Router and ExecutionValidator.'
    decision_role: fast_path_gate_only
    action_patterns:
    - 찾아줘
    - 보여줘
    - 표시해줘
    - 이동
    - 가줘
    - 위치
    - 어디
    - 좌표
    - find
    - show
    - move
    - where
    standalone_place_suffix_pattern: '^[가-힣A-Za-z0-9·\s]{2,30}(구|시|군|읍|면|동|리|도|항|만|해수욕장)$'
    suppress_when_signals:
    - signal_id: spatial_relation
      reason: spatial relation requires anchor/target separation
      terms:
      - 부근
      - 주변
      - 근처
      - 이내
      - 반경
      - 인근
      - 앞바다
      - 해역
    - signal_id: marine_gazetteer_target
      reason: gazetteer target must use marine gazetteer resolver
      terms:
      - 해저지명
      - 해저 지명
      - 해양지명
      - 해양 지명
      - 부근 지명
      - 주변 지명
    - signal_id: analysis_target
      reason: analysis target requires Semantic Router and ExecutionValidator
      terms:
      - 사고
      - 사건
      - 바닷길
      - 바다갈라짐
      - 신항만예정지역
      - 신항만 예정지역
      - 보호수역
      - 투기장
      - 투기구역
      - vts
      - 위험
      - 침선
      - 장애물
      - 통항
      - 교통
      - 항로
      - 정박지
      - 보호구역
      - 천연보호구역
      - ais
      - v-pass
      - vpass
    - signal_id: document_or_authority_query
      reason: legal, notice, standard, definition, or evidence requests must use document/RAG routing
      terms:
      - 고시
      - 법령
      - 규정
      - 표준
      - 문서
      - 근거
      - 지형도면
      - 지형 도면
      - 육상항만구역
      - 항만구역
      - 토지이용규제
      - 항만기본계획
      - 선박통항규칙
      - 예선운영
      - 정의
      - 설명
      - 뜻
      - 의미
      - 이란
      - 란
      - notice
      - law
      - legal
      - standard
      - definition
      - evidence
    suppress_when_semantic_place_types:
    - marine_gazetteer
lexical_signals:
- signal_id: accident_event
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 사고
  - 사건
  - 해상조난
  - 조난사고
  - 해양사고
  - 선박사고
  - accident
  - incident
  - case
- signal_id: accident_history
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 사고 이력
  - 사고이력
  - 사고 내역
  - 사고내역
  - 이력
  - history
  - accident history
- signal_id: accident_cause
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 정비불량
  - 관리소홀
  - 운항부주의
  - 안전부주의
  - 원인미상
  - 발생원인
- signal_id: accident_type
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 기관손상
  - 추진기손상
  - 키손상
  - 침몰
  - 침수
  - 좌초
  - 좌주
  - 충돌
  - 접촉
  - 화재
  - 전복
  - 표류
  - 발생유형
- signal_id: structured_event_lookup
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 찾아줘
  - 찾아
  - 검색
  - 조회
  - 목록
  - 찾아 볼래
- signal_id: nearby_search
  routes:
  - SPATIAL_ANALYSIS
  terms:
  - 부근
  - 근처
  - 주변
  - 반경
  - 이내
- signal_id: marine_gazetteer_target
  routes:
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  terms:
  - 해저지명
  - 해저 지명
  - 해양지명
  - 해양 지명
  - 지명
uport_capability_defaults: &uport_capability_defaults
  input_schema: {type: object}
  output_schema: {type: object}
  resolver: []
  agent: null
  validation_rules: [QEC_REQUIRED, DATASET_AUTHORITY_REQUIRED]
  permission: read
  timeout_ms: 5000
  fallback: none
  examples: []
capabilities:
- capability_id: uport.s101.berth.search
  <<: *uport_capability_defaults
  name: Charted berth search
  domain: uport
  object_type: tool_description
  label: S-101 charted berth lookup
  description: Search charted berth features in the S-101 valid projection.
  cue_terms: [선석, 부두, berth, 접안]
  required_entities: []
  required_dataset: [s101_current]
  depends_on: []
  tool: uport.map.berths
  agent: S101Agent
  status: available
- capability_id: uport.s101.hazard.search
  <<: *uport_capability_defaults
  name: S-101 navigational hazard search
  domain: uport
  object_type: agent_description
  label: S-101 hazards near a vessel
  description: Find charted navigational hazards around a verified vessel position.
  cue_terms: [항행 위험, 위험 객체, 위험물, navigational hazard]
  required_entities: [vessel]
  required_dataset: [s101_current, live_ais]
  depends_on: [uport.ais.search]
  tool: uport.s101.hazard.search
  agent: S101Agent
  status: unavailable
- capability_id: uport.s101.hazard.viewport
  <<: *uport_capability_defaults
  name: S-101 hazard viewport search
  domain: uport
  object_type: tool_description
  label: Charted hazards in current map bounds
  description: Search approved S-101 navigational hazards in a validated WGS84 map viewport.
  cue_terms: [지도 범위 위험객체, 지도 범위의 위험객체, 현재 범위 위험객체, 지도 위험객체, map hazards]
  required_entities: []
  required_dataset: [s101_current]
  depends_on: []
  tool: postgis.intersects
  agent: Spatial Analysis Agent
  status: available
- capability_id: uport.ais.search
  <<: *uport_capability_defaults
  name: Live AIS search
  domain: uport
  object_type: tool_description
  label: Live AIS vessel lookup
  description: Find timestamped live vessel positions for a selected port.
  cue_terms: [선박, AIS, ais, vessel, 입항]
  required_entities: [port]
  required_dataset: [live_ais]
  depends_on: []
  tool: uport.map.vessels
  agent: AISAgent
  status: unavailable
- capability_id: uport.eta.predict
  <<: *uport_capability_defaults
  name: ETA prediction
  domain: uport
  object_type: agent_description
  label: Vessel ETA prediction
  description: Predict arrival time from validated AIS observations.
  cue_terms: [ETA, eta, 도착, 지연]
  required_entities: [vessel]
  required_dataset: [live_ais, eta_model]
  depends_on: [uport.ais.search]
  tool: uport.eta.predict
  agent: PredictionAgent
  status: unavailable
- capability_id: uport.berth.optimize
  <<: *uport_capability_defaults
  name: Berth optimization recommendation
  domain: uport
  object_type: agent_description
  label: Berth assignment recommendation
  description: Recommend a berth plan from validated schedules and constraints.
  cue_terms: [재배정, 최적화, 배정안, 대기시간]
  required_entities: [port]
  required_dataset: [port_operations]
  depends_on: [uport.s101.berth.search, uport.eta.predict]
  tool: uport.berth.optimize
  agent: BerthOptimizationAgent
  status: unavailable
- capability_id: uport.berth.explain
  <<: *uport_capability_defaults
  name: Berth recommendation explanation
  domain: uport
  object_type: agent_description
  label: Explain a verified berth recommendation
  description: Explain optimizer constraints and evidence for a recorded berth recommendation.
  cue_terms: [추천된 선석, 적합한 이유, 추천 이유]
  required_entities: [port]
  required_dataset: [port_operations]
  depends_on: [uport.berth.optimize]
  tool: uport.berth.explain
  agent: BerthOptimizationAgent
  status: unavailable
- capability_id: uport.map.visualize
  <<: *uport_capability_defaults
  name: Map visualization
  domain: uport
  object_type: tool_description
  label: Map focus and highlight
  description: Focus verified result features on the existing port map.
  cue_terms: [지도, 표시, 보여줘, highlight]
  required_entities: []
  required_dataset: []
  depends_on: []
  tool: uport.map.visualize
  status: available
- capability_id: uport.port_knowledge.search
  <<: *uport_capability_defaults
  name: Port knowledge search
  domain: uport
  object_type: agent_description
  label: Port operations knowledge retrieval
  description: Retrieve grounded port operating rules and procedures.
  cue_terms: [규정, 절차, 문서, 지식, regulation]
  required_entities: []
  required_dataset: [port_knowledge]
  depends_on: []
  tool: uport.port_knowledge.search
  agent: PortKnowledgeAgent
  status: unavailable
- capability_id: resolver.place_registry
  object_type: resolver_description
  label: Place Registry Resolver
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  role: supporting_or_primary
  description: 'Resolve Korean maritime place names, ports, port entrances, islands, and curated reference points to canonical geometry and provenance.

    '
  input_slots:
  - query_text
  - place_name
  output_slots:
  - canonical_name
  - geometry
  - crs
  - source_ref
  - authority
  authority_ref: data/place_geometry_registry.yaml
  registry_ref: data/place_geometry_registry.yaml
  deterministic_hints:
  - find_intent
  - place_name
  - location_text
  - nearby_search
  - semantic_place_like
  - semantic_place_type:administrative_area
  - semantic_place_type:island
  - semantic_place_type:port
  - semantic_place_type:address
  - administrative_place_lookup
- capability_id: resolver.poi_beach_place
  object_type: resolver_description
  label: POI and Beach Place Resolver
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  role: primary_or_supporting
  description: 'Resolve place-like Korean POI queries for beaches, tourism POIs, landmarks, parks, and named coastal facilities. This resolver classifies terms such as 해수욕장, 해변, 관광지, 명소, 공원, and beach as POI place targets before geometry authority is checked.

    '
  input_slots:
  - query_text
  - place_name
  - place_type
  output_slots:
  - canonical_name
  - place_type
  - candidate_geometry
  - source_ref
  - authority_level
  authority_ref: data/place_geometry_registry.yaml
  registry_ref: data/external_evidence_registry.yaml
  deterministic_hints:
  - semantic_place_type:poi_beach
  - semantic_place_type:tourism_poi
  - poi_beach
  - tourism_poi
  - beach
- capability_id: resolver.osm_supplemental_place
  object_type: resolver_description
  label: OSM Supplemental Place Candidate Resolver
  routes:
  - PLACE_LOOKUP
  - EXTERNAL_EVIDENCE_GAP_FILL
  role: supporting
  description: 'Generate OSM/Nominatim or Overpass supplemental place candidates when local authoritative and curated place registries do not resolve a place-like query. OSM candidates are never authoritative by themselves and require registry/KG review before promotion.

    '
  input_slots:
  - query_text
  - place_name
  - place_type
  output_slots:
  - supplemental_candidates
  - candidate_geometry
  - source_url
  - review_required
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: data/external_evidence_registry.yaml
  deterministic_hints:
  - osm_supplemental
  - external_gap_fill
  - poi_beach
  - administrative_place_lookup
- capability_id: tool.external_evidence_gap_fill
  object_type: tool_description
  label: External Evidence Gap-Fill Tool
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  - EXTERNAL_EVIDENCE_GAP_FILL
  role: supporting
  description: 'Run the external evidence gap-fill loop: local authoritative registry first, public authoritative candidates second, OSM/RAG supplemental candidates third, then review-gated promotion candidates. This tool returns candidates only unless registry authority is verified.

    '
  input_slots:
  - query_text
  - domain_id
  - anchor_geometry
  output_slots:
  - local_checks
  - public_authoritative_candidates
  - supplemental_candidates
  - promotion_candidates
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: scripts/run_external_evidence_gap_fill.py
  deterministic_hints:
  - external_gap_fill
  - osm_supplemental
  - rag_supplemental
  - candidate_only_until_verified
- capability_id: resolver.dataset_provenance_registry
  object_type: resolver_description
  label: Dataset Provenance Resolver
  routes:
  - DATASET_PROVENANCE
  role: primary
  description: 'Resolve questions about Dataset source files, parsing, standardization, serving tables, ingestion reports, row counts, and embedding coverage.

    '
  input_slots:
  - query_text
  - dataset_name
  output_slots:
  - source_file
  - serving_table
  - row_count
  - ingestion_report
  - embedding_status
  authority_ref: outputs/reports/dataset_embedding_coverage.json
  registry_ref: outputs/reports/requested_dataset_layer_ingestion.md
  deterministic_hints:
  - provenance_request
  - dataset_term
  - ingestion_status
  - evidence_domain_dataset
  - knowledge_document_chunks
  - gazetteer_provenance
  - source_file_basis
  - embedding_coverage
- capability_id: resolver.marine_gazetteer_spatial
  object_type: resolver_description
  label: Marine Gazetteer Spatial Resolver
  routes:
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  - LAYER_INSPECTION
  role: primary_or_supporting
  description: 'Resolve nearby marine place-name and undersea-place-name questions to the executable marine gazetteer spatial layer. Use this for queries asking for 해양지명, 해저지명, 부근 지명, 주변 지명, or marine place names near a resolved anchor such as Dokdo.

    '
  input_slots:
  - query_text
  - anchor_geometry
  - radius_m
  output_slots:
  - marine_place_names
  - display_name
  - geometry
  - distance_m
  - source_ref
  authority_ref: Dataset/해양수산부_공동활용체계_해양지명_20221231.csv
  registry_ref: data/spatial_layer_registry.yaml
  deterministic_hints:
  - place_name
  - nearby_search
  - marine_gazetteer_target
  - undersea_place_name
  - seabed_name
  - dokdo_nearby_gazetteer
  - typo_normalized_nearby
- capability_id: resolver.s101_feature_dictionary
  object_type: feature_class_description
  label: S-101 Feature Dictionary Resolver
  routes:
  - SPATIAL_ANALYSIS
  - STANDARD_RAG
  - LAYER_INSPECTION
  role: supporting_or_primary
  description: 'Resolve S-101 feature class names, aliases, hazard feature groups, geometry type, catalogue references, and portrayal references.

    '
  input_slots:
  - query_text
  - feature_term
  output_slots:
  - feature_type
  - feature_code
  - feature_group
  - catalogue_ref
  - portrayal_ref
  authority_ref: data/s101_catalogue.json
  registry_ref: data/derived_concept_registry_v2.yaml
  deterministic_hints:
  - feature_term
  - hazard_target
  - s101_term
  - obstruction
  - wreck
  - buoy
  - beacon
  - navigation_aid
  - candidate_only_until_verified
- capability_id: tool.spatial_radius_search
  object_type: tool_description
  label: Spatial Radius Search Tool
  routes:
  - SPATIAL_ANALYSIS
  role: primary
  description: 'Execute radius-based spatial feature search using a verified anchor geometry, radius in meters, and target feature candidates. Source-backed S-101 term mappings require all validated attribute predicates; missing attributes do not match and unresolved term mappings cannot execute.

    '
  input_slots:
  - anchor_geometry
  - radius_m
  - target_feature_group
  output_slots:
  - spatial_features
  - feature_count
  - query_extent
  - map_layers
  authority_ref: data/query_template_registry.yaml
  registry_ref: data/spatial_layer_registry.yaml
  deterministic_hints:
  - radius_slot
  - nearby_search
  - spatial_relation
  - execution_validator_required
  - verified_anchor_geometry
  - verified_tool_binding
  - positive_radius_required
- capability_id: tool.dynamic_traffic_aggregation
  object_type: tool_description
  label: Dynamic AIS/V-PASS Traffic Aggregation Tool
  routes:
  - TRAFFIC_ANALYSIS
  role: primary
  description: 'Aggregate AIS and V-PASS traffic counts by time window, cell, source, and region using analytical dynamic traffic layers.

    '
  input_slots:
  - temporal_window
  - spatial_filter
  output_slots:
  - traffic_count
  - grid_cells
  - source_breakdown
  - monthly_breakdown
  authority_ref: data/time_series_registry.yaml
  registry_ref: data/data_registry.yaml
  deterministic_hints:
  - traffic_term
  - temporal_window
  - ais_vpass
- capability_id: tool.graph_scoped_rag
  object_type: tool_description
  label: Graph-Scoped RAG Retriever
  routes:
  - STANDARD_RAG
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'Retrieve authoritative document chunks, evidence candidates, legal or standard references, and S-101 catalogue/DCEG text with KG context.

    '
  input_slots:
  - query_text
  - route_tags
  - evidence_filter
  output_slots:
  - documents
  - citations
  - evidence_candidates
  - quality_metrics
  authority_ref: data/evidence_registry.yaml
  registry_ref: knowledge.document_chunks
  deterministic_hints:
  - definition_request
  - evidence_request
  - standard_term
  - evidence_domain_standard_or_legal
  - not_dataset_provenance
- capability_id: resolver.external_evidence_gap_fill
  object_type: resolver_description
  label: External Evidence Gap-Fill Resolver
  routes:
  - EXTERNAL_EVIDENCE_GAP_FILL
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'When local ENC/S-101 or serving spatial layers do not contain the requested object, create a conservative gap-fill plan: local authoritative registry first, public authoritative source candidates second, OSM/RAG supplemental candidates third, then validation and review-gated promotion.

    '
  input_slots:
  - query_text
  - gap_domain
  - anchor_place
  - radius_m
  output_slots:
  - local_gap_report
  - external_candidates
  - evidence_candidates
  - promotion_candidates
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: outputs/external_evidence/gap_fill_candidates.jsonl
  deterministic_hints:
