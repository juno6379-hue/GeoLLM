version: '0.1'
status: dry_run
description: 'Candidate-first capability registry for GeoLLM. These entries are used to retrieve Resolver, Agent, Tool, Dataset, Ontology, marine term, and feature class candidates before KG/Registry verification. Similarity from this registry is never authority by itself.

  '
policies:
  pgvector_role: candidate_retrieval_only
  authority_gate_required: true
  ollama_role: ambiguity_resolver_only
  verified_execution_only: true
lexical_signals:
- signal_id: accident_event
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 사고
  - 사건
  - 해상조난
  - 조난사고
  - 해양사고
  - 선박사고
  - accident
  - incident
  - case
- signal_id: accident_history
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 사고 이력
  - 사고이력
  - 사고 내역
  - 사고내역
  - 이력
  - history
  - accident history
- signal_id: accident_cause
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 정비불량
  - 관리소홀
  - 운항부주의
  - 안전부주의
  - 원인미상
  - 발생원인
- signal_id: accident_type
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 기관손상
  - 추진기손상
  - 키손상
  - 침몰
  - 침수
  - 좌초
  - 좌주
  - 충돌
  - 접촉
  - 화재
  - 전복
  - 표류
  - 발생유형
- signal_id: structured_event_lookup
  routes:
  - ACCIDENT_ANALYSIS
  terms:
  - 찾아줘
  - 찾아
  - 검색
  - 조회
  - 목록
  - 찾아 볼래
- signal_id: nearby_search
  routes:
  - SPATIAL_ANALYSIS
  terms:
  - 부근
  - 근처
  - 주변
  - 반경
  - 이내
- signal_id: marine_gazetteer_target
  routes:
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  terms:
  - 해저지명
  - 해저 지명
  - 해양지명
  - 해양 지명
  - 지명
capabilities:
- capability_id: resolver.place_registry
  object_type: resolver_description
  label: Place Registry Resolver
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  role: supporting_or_primary
  description: 'Resolve Korean maritime place names, ports, port entrances, islands, and curated reference points to canonical geometry and provenance.

    '
  input_slots:
  - query_text
  - place_name
  output_slots:
  - canonical_name
  - geometry
  - crs
  - source_ref
  - authority
  authority_ref: data/place_geometry_registry.yaml
  registry_ref: data/place_geometry_registry.yaml
  deterministic_hints:
  - find_intent
  - place_name
  - location_text
  - nearby_search
  - semantic_place_like
  - semantic_place_type:administrative_area
  - semantic_place_type:island
  - semantic_place_type:port
  - semantic_place_type:address
  - administrative_place_lookup
- capability_id: resolver.poi_beach_place
  object_type: resolver_description
  label: POI and Beach Place Resolver
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  role: primary_or_supporting
  description: 'Resolve place-like Korean POI queries for beaches, tourism POIs, landmarks, parks, and named coastal facilities. This resolver classifies terms such as 해수욕장, 해변, 관광지, 명소, 공원, and beach as POI place targets before geometry authority is checked.

    '
  input_slots:
  - query_text
  - place_name
  - place_type
  output_slots:
  - canonical_name
  - place_type
  - candidate_geometry
  - source_ref
  - authority_level
  authority_ref: data/place_geometry_registry.yaml
  registry_ref: data/external_evidence_registry.yaml
  deterministic_hints:
  - semantic_place_type:poi_beach
  - semantic_place_type:tourism_poi
  - poi_beach
  - tourism_poi
  - beach
- capability_id: resolver.osm_supplemental_place
  object_type: resolver_description
  label: OSM Supplemental Place Candidate Resolver
  routes:
  - PLACE_LOOKUP
  - EXTERNAL_EVIDENCE_GAP_FILL
  role: supporting
  description: 'Generate OSM/Nominatim or Overpass supplemental place candidates when local authoritative and curated place registries do not resolve a place-like query. OSM candidates are never authoritative by themselves and require registry/KG review before promotion.

    '
  input_slots:
  - query_text
  - place_name
  - place_type
  output_slots:
  - supplemental_candidates
  - candidate_geometry
  - source_url
  - review_required
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: data/external_evidence_registry.yaml
  deterministic_hints:
  - osm_supplemental
  - external_gap_fill
  - poi_beach
  - administrative_place_lookup
- capability_id: tool.external_evidence_gap_fill
  object_type: tool_description
  label: External Evidence Gap-Fill Tool
  routes:
  - PLACE_LOOKUP
  - SPATIAL_ANALYSIS
  - EXTERNAL_EVIDENCE_GAP_FILL
  role: supporting
  description: 'Run the external evidence gap-fill loop: local authoritative registry first, public authoritative candidates second, OSM/RAG supplemental candidates third, then review-gated promotion candidates. This tool returns candidates only unless registry authority is verified.

    '
  input_slots:
  - query_text
  - domain_id
  - anchor_geometry
  output_slots:
  - local_checks
  - public_authoritative_candidates
  - supplemental_candidates
  - promotion_candidates
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: scripts/run_external_evidence_gap_fill.py
  deterministic_hints:
  - external_gap_fill
  - osm_supplemental
  - rag_supplemental
  - candidate_only_until_verified
- capability_id: resolver.dataset_provenance_registry
  object_type: resolver_description
  label: Dataset Provenance Resolver
  routes:
  - DATASET_PROVENANCE
  role: primary
  description: 'Resolve questions about Dataset source files, parsing, standardization, serving tables, ingestion reports, row counts, and embedding coverage.

    '
  input_slots:
  - query_text
  - dataset_name
  output_slots:
  - source_file
  - serving_table
  - row_count
  - ingestion_report
  - embedding_status
  authority_ref: outputs/reports/dataset_embedding_coverage.json
  registry_ref: outputs/reports/requested_dataset_layer_ingestion.md
  deterministic_hints:
  - provenance_request
  - dataset_term
  - ingestion_status
  - evidence_domain_dataset
  - knowledge_document_chunks
  - gazetteer_provenance
  - source_file_basis
  - embedding_coverage
- capability_id: resolver.marine_gazetteer_spatial
  object_type: resolver_description
  label: Marine Gazetteer Spatial Resolver
  routes:
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  - LAYER_INSPECTION
  role: primary_or_supporting
  description: 'Resolve nearby marine place-name and undersea-place-name questions to the executable marine gazetteer spatial layer. Use this for queries asking for 해양지명, 해저지명, 부근 지명, 주변 지명, or marine place names near a resolved anchor such as Dokdo.

    '
  input_slots:
  - query_text
  - anchor_geometry
  - radius_m
  output_slots:
  - marine_place_names
  - display_name
  - geometry
  - distance_m
  - source_ref
  authority_ref: Dataset/해양수산부_공동활용체계_해양지명_20221231.csv
  registry_ref: data/spatial_layer_registry.yaml
  deterministic_hints:
  - place_name
  - nearby_search
  - marine_gazetteer_target
  - undersea_place_name
  - seabed_name
  - dokdo_nearby_gazetteer
  - typo_normalized_nearby
- capability_id: resolver.s101_feature_dictionary
  object_type: feature_class_description
  label: S-101 Feature Dictionary Resolver
  routes:
  - SPATIAL_ANALYSIS
  - STANDARD_RAG
  - LAYER_INSPECTION
  role: supporting_or_primary
  description: 'Resolve S-101 feature class names, aliases, hazard feature groups, geometry type, catalogue references, and portrayal references.

    '
  input_slots:
  - query_text
  - feature_term
  output_slots:
  - feature_type
  - feature_code
  - feature_group
  - catalogue_ref
  - portrayal_ref
  authority_ref: data/s101_catalogue.json
  registry_ref: data/derived_concept_registry_v2.yaml
  deterministic_hints:
  - feature_term
  - hazard_target
  - s101_term
  - obstruction
  - wreck
  - buoy
  - beacon
  - navigation_aid
  - candidate_only_until_verified
- capability_id: tool.spatial_radius_search
  object_type: tool_description
  label: Spatial Radius Search Tool
  routes:
  - SPATIAL_ANALYSIS
  role: primary
  description: 'Execute radius-based spatial feature search using a verified anchor geometry, radius in meters, and target feature candidates.

    '
  input_slots:
  - anchor_geometry
  - radius_m
  - target_feature_group
  output_slots:
  - spatial_features
  - feature_count
  - query_extent
  - map_layers
  authority_ref: data/query_template_registry.yaml
  registry_ref: data/spatial_layer_registry.yaml
  deterministic_hints:
  - radius_slot
  - nearby_search
  - spatial_relation
  - execution_validator_required
  - verified_anchor_geometry
  - verified_tool_binding
  - positive_radius_required
- capability_id: tool.dynamic_traffic_aggregation
  object_type: tool_description
  label: Dynamic AIS/V-PASS Traffic Aggregation Tool
  routes:
  - TRAFFIC_ANALYSIS
  role: primary
  description: 'Aggregate AIS and V-PASS traffic counts by time window, cell, source, and region using analytical dynamic traffic layers.

    '
  input_slots:
  - temporal_window
  - spatial_filter
  output_slots:
  - traffic_count
  - grid_cells
  - source_breakdown
  - monthly_breakdown
  authority_ref: data/time_series_registry.yaml
  registry_ref: data/data_registry.yaml
  deterministic_hints:
  - traffic_term
  - temporal_window
  - ais_vpass
- capability_id: tool.graph_scoped_rag
  object_type: tool_description
  label: Graph-Scoped RAG Retriever
  routes:
  - STANDARD_RAG
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'Retrieve authoritative document chunks, evidence candidates, legal or standard references, and S-101 catalogue/DCEG text with KG context.

    '
  input_slots:
  - query_text
  - route_tags
  - evidence_filter
  output_slots:
  - documents
  - citations
  - evidence_candidates
  - quality_metrics
  authority_ref: data/evidence_registry.yaml
  registry_ref: knowledge.document_chunks
  deterministic_hints:
  - definition_request
  - evidence_request
  - standard_term
  - evidence_domain_standard_or_legal
  - not_dataset_provenance
- capability_id: resolver.external_evidence_gap_fill
  object_type: resolver_description
  label: External Evidence Gap-Fill Resolver
  routes:
  - EXTERNAL_EVIDENCE_GAP_FILL
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'When local ENC/S-101 or serving spatial layers do not contain the requested object, create a conservative gap-fill plan: local authoritative registry first, public authoritative source candidates second, OSM/RAG supplemental candidates third, then validation and review-gated promotion.

    '
  input_slots:
  - query_text
  - gap_domain
  - anchor_place
  - radius_m
  output_slots:
  - local_gap_report
  - external_candidates
  - evidence_candidates
  - promotion_candidates
  authority_ref: data/external_evidence_registry.yaml
  registry_ref: outputs/external_evidence/gap_fill_candidates.jsonl
  deterministic_hints:
  - external_evidence_gap
  - no_local_s101_match
  - public_authoritative_source
  - natural_heritage_protected_area
  - osm_supplemental_only
  - promotion_review_required
  - protected_area_gap_fill
- capability_id: agent.spatial_analysis
  object_type: agent_description
  label: Spatial Analysis Agent
  routes:
  - SPATIAL_ANALYSIS
  - PLACE_LOOKUP
  - LAYER_INSPECTION
  role: primary
  description: 'Handles verified spatial analysis, place lookup, feature proximity, nearest feature search, map layers, legend, and click-detail surfaces.

    '
  input_slots:
  - route_plan
  - query_execution_context
  output_slots:
  - map_layers
  - spatial_result_summary
  - evidence_bundle
  authority_ref: data/agent_capability_registry.yaml
  registry_ref: data/agent_capability_registry.yaml
  deterministic_hints:
  - map_output
  - spatial_result
- capability_id: agent.data_discovery
  object_type: agent_description
  label: Data Discovery Agent
  routes:
  - DATASET_PROVENANCE
  - TRAFFIC_ANALYSIS
  role: primary_or_supporting
  description: 'Handles local data availability, Dataset provenance, serving table discovery, source coverage, and missing external-data requirements.

    '
  input_slots:
  - query_text
  - dataset_candidate
  output_slots:
  - data_discovery_result
  - source_evidence
  authority_ref: data/data_registry.yaml
  registry_ref: data/data_registry.yaml
  deterministic_hints:
  - dataset_term
  - provenance_request
  - data_availability
- capability_id: ontology.navigation_hazard_object
  object_type: ontology_class_description
  label: Navigation Hazard Object
  routes:
  - SPATIAL_ANALYSIS
  - LAYER_INSPECTION
  role: supporting
  description: 'Ontology concept for hazards to navigation, including obstruction, wreck, underwater or awash rock, and configured navigation-aid risk objects.

    '
  input_slots:
  - feature_term
  output_slots:
  - concept_id
  - feature_group
  - kg_path
  authority_ref: data/derived_concept_registry_v2.yaml
  registry_ref: data/derived_concept_registry_v2.yaml
  deterministic_hints:
  - hazard_target
  - feature_term
  - obstruction
  - wreck
  - buoy
  - beacon
  - navigation_aid
  - candidate_only_until_verified
- capability_id: term.marine_obstruction
  object_type: marine_term
  label: Obstruction
  routes:
  - STANDARD_RAG
  - SPATIAL_ANALYSIS
  - LAYER_INSPECTION
  role: supporting_or_primary
  description: 'Marine term and S-101 feature candidate for obstruction. Depending on the query, it may require definition retrieval, spatial object search, or layer inspection.

    '
  input_slots:
  - query_text
  output_slots:
  - canonical_term
  - feature_type
  - catalogue_ref
  authority_ref: data/s101_catalogue.json
  registry_ref: data/s101_smart_dictionary.json
  deterministic_hints:
  - feature_term
  - definition_request
  - hazard_target
- capability_id: dataset.dynamic_traffic_layer
  object_type: dataset_metadata
  label: AIS/V-PASS Dynamic Traffic Layer
  routes:
  - TRAFFIC_ANALYSIS
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'Metadata for AIS and V-PASS dynamic traffic analytical layers, available period, source breakdown, monthly statistics, and grid-cell summaries.

    '
  input_slots:
  - temporal_window
  - spatial_filter
  output_slots:
  - coverage_period
  - source_breakdown
  - row_count
  - analytical_layer
  authority_ref: data/time_series_registry.yaml
  registry_ref: data/data_registry.yaml
  deterministic_hints:
  - traffic_term
  - ais_vpass
  - temporal_window
- capability_id: resolver.accident_event_terms
  object_type: resolver_description
  label: Accident Event Term Resolver
  routes:
  - ACCIDENT_ANALYSIS
  role: supporting_or_primary
  description: 'Resolve accident event lookup terms such as jurisdiction, cause, accident type, sea area, and vessel type from Korean maritime accident queries.

    '
  input_slots:
  - query_text
  output_slots:
  - query_terms
  - authority
  - cause
  - accident_type
  - sea_area
  authority_ref: data/accident_dictionary.yaml
  registry_ref: data/agent_capability_registry.yaml
  deterministic_hints:
  - accident_event
  - accident_cause
  - accident_type
  - structured_event_lookup
  - event_row_authority
  - accident_term_dictionary
- capability_id: tool.accident_event_lookup
  object_type: tool_description
  label: Structured Accident Event Lookup Tool
  routes:
  - ACCIDENT_ANALYSIS
  role: primary
  description: 'Execute deterministic row-level lookup against serving.accident_events and return accident event rows, GeoJSON map points, counts, and evidence from the same authoritative row set.

    '
  input_slots:
  - query_terms
  - authority
  - cause
  - accident_type
  - sea_area
  output_slots:
  - accident_events
  - total_count
  - geojson
  - map_layers
  - evidence_bundle
  authority_ref: serving.accident_events
  registry_ref: data/query_template_registry.yaml
  deterministic_hints:
  - accident_event
  - accident_cause
  - accident_type
  - structured_event_lookup
  - event_row_authority
  - not_rag_authority
  - verified_tool_binding
- capability_id: tool.accident_spatial_history_lookup
  object_type: tool_description
  label: Structured Accident Spatial History Lookup Tool
  routes:
  - ACCIDENT_ANALYSIS
  - SPATIAL_ANALYSIS
  role: primary
  description: 'Resolve a verified place anchor, apply an explicit or default radius, and execute deterministic spatial accident history lookup against serving.accident_events using ST_DWithin. Returns accident event rows, distances from the anchor, GeoJSON map points, counts, and evidence from the same authoritative row set.

    '
  input_slots:
  - place_name
  - anchor_geometry
  - radius_m
  output_slots:
  - accident_events
  - total_count
  - distance_m
  - geojson
  - map_layers
  - evidence_bundle
  authority_ref: serving.accident_events
  registry_ref: data/query_template_registry.yaml
  deterministic_hints:
  - accident_event
  - accident_history
  - nearby_search
  - place_name
  - verified_anchor_geometry
  - spatial_relation_not_concept
  - event_row_authority
  - positive_radius_required
- capability_id: dataset.accident_events
  object_type: dataset_metadata
  label: Coast Guard Accident Events Serving Layer
  routes:
  - ACCIDENT_ANALYSIS
  - DATASET_PROVENANCE
  role: primary_or_supporting
  description: 'Authoritative serving table for Korea Coast Guard 2025 maritime distress accident event rows, with point geometry, occurrence time, authority, sea area, cause, type, vessel, and casualty attributes.

    '
  input_slots:
  - query_terms
  output_slots:
  - event_id
  - occurred_at
  - authority
  - sea_area
  - cause
  - accident_type
  - geometry
  authority_ref: serving.accident_events
  registry_ref: data/spatial_layer_registry.yaml
  deterministic_hints:
  - accident_event
  - accident_cause
  - accident_type
  - structured_event_lookup
- capability_id: ontology.accident_risk_event
  object_type: ontology_class_description
  label: Accident Risk Event
  routes:
  - ACCIDENT_ANALYSIS
  - SPATIAL_ANALYSIS
  role: supporting
  description: 'Ontology class for spatialized maritime accident or distress events and their dimensions: cause, type, jurisdiction authority, and sea area. Event lookup may show co-location but must not infer causality with S-101 objects without relation evidence.

    '
  input_slots:
  - accident_event
  output_slots:
  - upper_class
  - kg_path
  - evidence_partition
  authority_ref: data/upper_ontology_registry.yaml
  registry_ref: data/kg_ontology_contract.yaml
  deterministic_hints:
  - accident_event
  - accident_risk
