analysis_types:
  source_attribute_search:
    primary_agent: Spatial Analysis Agent
    required_tools: [postgis.dwithin]
    required_data: [projection.s101_feature_valid]
    outputs: [spatial_feature_evidence, attribute_filter_evidence]
  selected_feature_lookup:
    primary_agent: Spatial Analysis Agent
    required_tools: [postgis.selected_feature_lookup]
    required_data: [projection.s101_feature_valid]
    outputs: [selected_feature_evidence]
  document_search:
    primary_agent: Standard RAG Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - rag.graph_scoped_retrieve
    required_data:
      - knowledge_document_chunks
      - marine_kg
      - evidence_registry
    outputs:
      - StandardDocumentOutput
      - EvidenceBundle
      - Summary
  feature_search_by_radius:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Data Discovery Agent
      - Map Report Agent
      - Validation Agent
    required_tools:
      - geocoder.resolve_location
      - gbenc.s101_feature_search_by_radius
      - postgis.dwithin
    required_data:
      - GBENC_S101_feature
      - GBENC_codeinformation
      - s101_feature_dictionary
      - marine_term_dictionary
      - location_gazetteer
    outputs:
      - GeoJSON
      - MapLayer
      - FeatureTable
      - Summary
  accident_relation_lookup:
    primary_agent: Accident/Risk Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - accident.s101_relation_lookup
    required_data:
      - accident_s101_relation
      - GBENC_S101_feature
    outputs:
      - AccidentRelationEvidence
      - GeoJSON
      - Summary
  accident_event_lookup:
    primary_agent: Accident/Risk Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - accident.event_lookup
    required_data:
      - accident_events
      - accident_data
    outputs:
      - AccidentEventGeoJSON
      - FeatureTable
      - EvidenceBundle
      - Summary
  accident_spatial_history_lookup:
    primary_agent: Accident/Risk Agent
    secondary_agents:
      - Spatial Analysis Agent
      - Validation Agent
      - Map Report Agent
    required_tools:
      - geocoder.resolve_location
      - accident.spatial_history_lookup
      - postgis.dwithin
    required_data:
      - accident_events
      - location_gazetteer
    outputs:
      - AccidentEventGeoJSON
      - FeatureTable
      - EvidenceBundle
      - Summary
  current_tidal_lookup:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - ocean.current_tidal_lookup
    required_data:
      - tidal_current_surface
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  eddy_hazard_lookup:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - hazard.eddy_lookup
    required_data:
      - eddy_hazard_area
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  planned_port_overlay:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - development.planned_port_overlay
    required_data:
      - planned_port_area
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  island_gazetteer_lookup:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - place.island_gazetteer_lookup
    required_data:
      - island_gazetteer
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  sea_parting_prediction_lookup:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - tide.sea_parting_lookup
    required_data:
      - sea_parting_prediction
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  vessel_traffic_control_area_overlay:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - traffic.control_area_overlay
    required_data:
      - vessel_traffic_control_area
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  protected_area_lookup:
    primary_agent: Spatial Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - protected.area_lookup
    required_data:
      - protected_sea_area
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  traffic_search_by_time_space:
    primary_agent: AIS Analysis Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - traffic.dynamic_layer_search
    required_data:
      - DynamicTrafficLayer
      - traffic_data_dictionary
    outputs:
      - SpatialLayerEvidence
      - GeoJSON
      - Summary
  observed_time_series_analysis:
    primary_agent: Time-Series Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - timeseries.observation_analyze
    required_data:
      - tidal_current_surface
    outputs:
      - TimeSeriesMetrics
      - AnomalyTable
      - Summary
  observed_time_series_forecast:
    primary_agent: Time-Series Forecast Agent
    secondary_agents:
      - Validation Agent
      - Map Report Agent
    required_tools:
      - timeseries.forecast
    required_data:
      - tidal_current_surface
    outputs:
      - TimeSeriesForecast
      - ConfidenceInterval
      - Summary
