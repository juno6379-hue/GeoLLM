  - NEEDS_USER_INPUT
  - BLOCKED_CONFIG
  - BLOCKED_DATA
  - BLOCKED_POLICY
  - PLAN_READY
  - EXECUTION_READY
  agent_partial: PARTIAL
  task_empty: SUCCESS_EMPTY
  research_only:
  - UNRESOLVED_POLICY
  - DATA_OUT_OF_SCOPE
precedence:
- USER_EXPLICIT
- EXPLICIT_SEMANTIC_OPERATOR
- AUTHORITATIVE_RESOLUTION
- DEFAULT_POLICY
execution_authority: ExecutionValidator
missing_observation: null
