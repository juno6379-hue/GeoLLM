promotion_gates:
- reproduce_original_failure
- general_policy_not_case_literal
- independent_normal_and_negative_tests
- actual_api_verification
- source_policy_hash_freeze
- full_benchmark_rerun_after_production_change
scientific_limits:
- No independent human GOLD result is asserted
- Detector assignment is hypothesis, not measured superiority
- 30 representative specifications are not 30 passed runtime tests
- Research canonical boundary does not establish production legal harbour boundary
- No operating default radius is adopted by this registry
