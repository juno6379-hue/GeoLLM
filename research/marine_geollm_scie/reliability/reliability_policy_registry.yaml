  - B3
  - B4
  - P0
  - H
  same_initial_plan_hash: true
  review_shared_by:
  - B4
  - H
  p0_compilation: LOSSLESS_NO_INFERENCE
  missing_fields: PRESERVE_MISSING
status_layers:
