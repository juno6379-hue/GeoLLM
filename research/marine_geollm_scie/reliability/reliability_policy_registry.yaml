schema_version: '1.0'
production_enabled: false
scope: RESEARCH_SPECIFICATION_AND_PRODUCTION_REVIEW_REQUIREMENTS
default_distance_m: null
example_default_distance_m: 1000
example_is_adopted_policy: false
methods:
- B0
- B1
- B2
- B3
- B4
- P0
- H
- P1
matched_plan:
