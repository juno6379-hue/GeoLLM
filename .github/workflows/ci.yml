name: quality-gates
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install poetry
      - run: poetry config virtualenvs.create false
      - run: poetry install --with dev --no-interaction --no-ansi --no-root
      - run: pytest tests/unit -q
      - run: python scripts/validate_spatial_layer_contracts.py --registry-only
      - run: python -m compileall -q services shared scripts
  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg INSTALL_DEV=true -t geollm:test .